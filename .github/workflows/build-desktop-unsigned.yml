name: Build Desktop (Windows, unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'native/**'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/build-desktop-unsigned.yml'

permissions:
  contents: write

concurrency:
  group: build-desktop-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write desktop package environment
        shell: pwsh
        run: |
          $path = 'apps/desktop/.env.windows'
          @'
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=
          DOWNLOAD_TEST_RELEASE_ID=
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://updates.example.invalid/
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://updates.example.invalid/
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://login.example.invalid"]}
          DSH_DESKTOP_WINDOWS_SIGNATURE_CACHE_CONCURRENCY=4
          '@.TrimStart() | Set-Content -LiteralPath $path -Encoding utf8
          Get-Content $path

      - name: Record worktree state (after install)
        shell: pwsh
        run: |
          $state = @(git status --porcelain --untracked-files=normal)
          Set-Content -LiteralPath worktree-after-install.txt -Value $state -Encoding utf8
          "after install: $($state.Count) entries"

      - name: Build all gates
        run: pnpm build

      - name: Record worktree state (after build)
        shell: pwsh
        run: |
          $state = @(git status --porcelain --untracked-files=normal)
          Set-Content -LiteralPath worktree-after-build.txt -Value $state -Encoding utf8
          $state | Select-Object -First 40
          "after build: $($state.Count) entries"

      - name: Package desktop (unsigned, dir)
        shell: pwsh
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE 'package.log'
          pnpm --filter @deepseek-ai/dsh-desktop exec tsx scripts/package-target.ts win-x64 --unsigned --dir 2>&1 |
            Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "packaging failed with exit code $LASTEXITCODE" }

      - name: Upload packaging log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-log
          path: package.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Summarize failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path package.log) {
            "### packaging log tail" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content package.log -Tail 120 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Publish diagnostics to ci-logs branch
        if: always()
        shell: pwsh
        run: |
          git config user.name 'ci-log-bot'
          git config user.email 'ci-log-bot@users.noreply.github.com'
          git checkout -B ci-logs
          if (Test-Path package.log) { Copy-Item package.log ci-package.log -Force; git add -f ci-package.log }
          if (Test-Path worktree-after-install.txt) { git add -f worktree-after-install.txt }
          if (Test-Path worktree-after-build.txt) { git add -f worktree-after-build.txt }
          "run $env:GITHUB_RUN_ID conclusion=$env:GITHUB_JOB status=${{ job.status }}" | Set-Content -LiteralPath ci-run.txt -Encoding utf8
          git add -f ci-run.txt
          git commit -m "ci: diagnostics for run $env:GITHUB_RUN_ID" 2>$null
          if ($LASTEXITCODE -ne 0) { git commit --allow-empty -m "ci: diagnostics for run $env:GITHUB_RUN_ID" }
          git push --force origin ci-logs

      - name: Show produced artifacts
        run: |
          $root = 'apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/win-unpacked'
          Get-ChildItem $root -Force | Select-Object Name, Length | Format-Table -AutoSize
          $asar = Join-Path $root 'resources/app.asar'
          if (-not (Test-Path $asar)) { throw "missing $asar" }
          $size = (Get-Item $asar).Length
          "app.asar: {0:N0} bytes" -f $size
          $bytes = [System.IO.File]::ReadAllBytes($asar)
          $text = [System.Text.Encoding]::UTF8.GetString($bytes)
          "slot marker: " + $text.Contains('conversation.input.primary')

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-win-x64-unsigned
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/win-unpacked
          retention-days: 14

      - name: Pack resources zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Resolve-Path 'apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/win-unpacked/resources'
          $zip = Join-Path $env:GITHUB_WORKSPACE 'dsh-resources-win-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          try {
            $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
            if (Test-Path $sevenZip) {
              Push-Location $root
              try {
                & $sevenZip a -tzip -mx=5 $zip 'app.asar' 'app.asar.unpacked' | Out-Null
                if ($LASTEXITCODE -ne 0) { throw "7z exited with $LASTEXITCODE" }
              } finally { Pop-Location }
            } else {
              $stage = Join-Path $env:GITHUB_WORKSPACE 'release-stage'
              New-Item -ItemType Directory -Force -Path $stage | Out-Null
              Copy-Item (Join-Path $root 'app.asar') $stage -Force
              robocopy (Join-Path $root 'app.asar.unpacked') (Join-Path $stage 'app.asar.unpacked') /MIR /NFL /NDL /NJH /NJS /NP | Out-Null
              Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Fastest
            }
            if (-not (Test-Path $zip)) { throw 'zip was not created' }
            "zip: {0:N0} MB" -f ((Get-Item $zip).Length / 1MB)
          } catch {
            "PACK ZIP ERROR: $($_.Exception.Message)" | Out-File -FilePath package.log -Append -Encoding utf8
            throw
          }

      - name: Publish resources release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'desktop-latest'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease --title 'Desktop build (unsigned, latest)' --notes "Automated unsigned Windows build from $env:GITHUB_SHA. Download dsh-resources-win-x64.zip and install it with ops/install-desktop.ps1."
          }
          gh release upload $tag dsh-resources-win-x64.zip --clobber
